[project]
name = "makepiano"
version = "0.1.0"
description = "YouTube URL -> piano sheet music (transcription, source separation, engraving, synced playback)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.9.1",
    "demucs>=4.0.1",
    "fastapi>=0.141.1",
    "music21>=10.5.0",
    "piano-transcription-inference>=0.0.6",
    "pypdf>=6.18.1",
    "python-multipart>=0.0.32",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.52.4",
    "verovio>=6.3.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
makepiano = "makepiano.cli:main"
makepiano-web = "makepiano.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["makepiano"]
