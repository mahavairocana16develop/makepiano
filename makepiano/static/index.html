<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>makepiano</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --fg:#e8eaf0; --muted:#8a90a0; --accent:#6c8cff; --err:#ff6b6b; --hl:#ff5a5a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 980px; margin: 0 auto; padding: 40px 20px 120px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  p.sub { color: var(--muted); margin: 0 0 28px; }
  form { display:flex; gap:10px; flex-wrap:wrap; }
  input[type=url] { flex:1 1 420px; font-size:16px; padding:12px 14px; border-radius:10px; border:1px solid #2a2f3a; background:var(--card); color:var(--fg); }
  button { font-size:16px; padding:12px 22px; border-radius:10px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  details { margin-top:14px; color:var(--muted); }
  details label { display:inline-block; margin:6px 16px 0 0; }
  details input[type=number] { width:80px; padding:4px 6px; border-radius:6px; border:1px solid #2a2f3a; background:var(--card); color:var(--fg); }
  select { padding:4px 6px; border-radius:6px; border:1px solid #2a2f3a; background:var(--card); color:var(--fg); }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-top:24px; }
  .bar { height:10px; background:#262b36; border-radius:5px; overflow:hidden; margin:12px 0 6px; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .6s; }
  .stage { color:var(--muted); font-size:13px; display:flex; justify-content:space-between; }
  pre.log { max-height:220px; overflow:auto; font-size:12px; color:var(--muted); margin:10px 0 0; white-space:pre-wrap; }
  .links a { display:inline-block; margin:8px 12px 0 0; color:var(--accent); font-weight:600; text-decoration:none; }
  .pages { margin-top:16px; display:flex; flex-direction:column; gap:16px; }
  .page { background:#fff; border-radius:8px; }
  .page svg { width:100%; height:auto; display:block; }
  .page .playing * { fill: var(--hl) !important; stroke: var(--hl) !important; }
  .page g.measure { cursor: pointer; }
  .page g.measure.loopsel * { fill: #3b5bdb; stroke: #3b5bdb; }
  #player input.bar { width:52px; padding:3px 4px; border-radius:6px; border:1px solid #2a2f3a; background:var(--card); color:var(--fg); }
  .err { color:var(--err); }
  .viewbar { display:flex; gap:8px; margin-top:14px; }
  .viewbar button { padding:8px 16px; font-size:14px; background:#262b36; }
  .viewbar button.on { background:var(--accent); }
  .viewbar { align-items:center; color:var(--muted); }
  #pianoView { display:none; margin-top:16px; }
  #pianoView canvas { width:100%; height:660px; display:block; border-radius:8px; background:#0b0d12; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--muted); border-top-color:var(--accent); border-radius:50%; animation:s 1s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes s { to { transform:rotate(360deg);} }
  /* player */
  #player { position:fixed; left:0; right:0; bottom:0; background:#12151c; border-top:1px solid #2a2f3a; padding:10px 20px; display:none; z-index:10; }
  #player .row { max-width:980px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  #player button.play { width:44px; height:44px; border-radius:50%; padding:0; font-size:18px; }
  #player input[type=range] { flex:1 1 200px; }
  #player .time { font-variant-numeric: tabular-nums; color:var(--muted); min-width:90px; }
  #player .status { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>🎹 makepiano</h1>
  <p class="sub">YouTube の URL を貼るとピアノ譜（PDF / MIDI / MusicXML）を自動生成します。</p>
  <form id="f">
    <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
    <button id="go" type="submit">楽譜を作る</button>
  </form>
  <div style="margin-top:14px;color:var(--muted)">
    作成する音源の種類（後から切り替え可）：
    <label><input type="checkbox" name="stem" value="none" checked> 分離なし</label>
    <label title="ピアノの左手の低音はベースとして分離されるため、練習用はこれが既定"><input type="checkbox" name="stem" value="other_bass" checked> 伴奏＋ベース（歌・ドラム除去）</label>
    <label><input type="checkbox" name="stem" value="other" checked> 伴奏のみ（歌・ドラム・ベース除去）</label>
    <label><input type="checkbox" name="stem" value="piano" checked> ピアノのみ</label>
    <label><input type="checkbox" name="stem" value="no_vocals" checked> 歌だけ除去</label>
  </div>
  <div style="margin-top:10px;color:var(--muted)">
    楽譜の方針：
    <label><input type="radio" name="fidelity" value="faithful" checked> 演奏に忠実（三連符・短い音・ペダル・強弱を記譜）</label>
    <label><input type="radio" name="fidelity" value="clean"> 読みやすさ優先（16分格子、次の和音まで伸ばす）</label>
  </div>
  <details>
    <summary>詳細設定</summary>
    <label>BPM（空=自動）<input type="number" id="bpm" step="0.1" placeholder="auto"></label>
    <label>最小音価 <select id="grid"><option value="2">8分</option><option value="4" selected>16分</option></select></label>
    <label>三連符の自動検出 <select id="trip"><option value="16th" selected>8分・16分三連</option><option value="8th">8分三連のみ</option><option value="off">なし</option></select></label>
    <label>左右分割音高 <input type="number" id="split" value="60"></label>
    <label>拍子 <select id="bpb"><option value="4" selected>4/4</option><option value="3">3/4</option><option value="2">2/4</option><option value="6">6/4</option></select></label>
    <label><input type="checkbox" id="legato" checked> 音を次の和音まで伸ばす</label>
    <label><input type="checkbox" id="chords" checked> コードネーム</label>
    <label>小節線ずらし(拍) <input type="number" id="off" value="0"></label>
    <label>手の広がり <select id="span"><option value="12" selected>1オクターブ</option><option value="14">9度（手が大きい人）</option><option value="10">7度（小さめ）</option></select></label>
    <label title="採譜結果を合成して元音源と比較し、最も近い検出設定を選びます（採譜時間が1〜2分伸びます）"><input type="checkbox" id="refine" checked> 合成比較で採譜を最適化</label>
    <label title="同じ動画のジョブがあれば分離・採譜を再利用します。オンで全部やり直します"><input type="checkbox" id="force"> 作り直す（再利用しない）</label>
  </details>
  <div id="past" style="margin-top:14px;color:var(--muted);display:none">過去の結果を開く： <select id="pastSel"><option value="">選択…</option></select></div>
  <div id="out"></div>
</main>

<div id="player">
  <div class="row">
    <button class="play" id="pp" title="再生/停止 (Space)">▶</button>
    <select id="mode"></select>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
    <select id="rate"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option></select>
    <span id="synthOpts" class="status" style="display:none">
      演奏データ <select id="srcSel" title="採譜した演奏: 実際の打鍵タイミング・強弱・ペダル。楽譜どおり: 表示中の楽譜（アレンジ含む）"><option value="perf">採譜した演奏</option><option value="score">楽譜どおり</option></select>
      テンポ <select id="tempoSel"><option value="follow">元音源に合わせる</option><option value="fixed">一定 <span id="fixedBpm"></span></option></select>
    </span>
    <label class="status" id="loopWrap" title="楽譜の小節をクリックしても指定できます（1回目=開始、2回目=終了）"><input type="checkbox" id="loopOn"> リピート 小節 <input class="bar" id="loopA" type="number" min="1" value="1"> 〜 <input class="bar" id="loopB" type="number" min="1" value="4"></label>
    <label class="status" id="revWrap" style="display:none">残響 <input type="range" id="reverb" min="0" max="100" value="30" style="width:90px;vertical-align:middle"></label>
    <span class="status" id="pstatus"></span>
  </div>
</div>

<script>
const f = document.getElementById('f'), out = document.getElementById('out'), go = document.getElementById('go');
f.onsubmit = async (e) => {
  e.preventDefault(); go.disabled = true; player.stop(); document.getElementById('player').style.display = 'none';
  out.innerHTML = `<div class="card"><span class="spin"></span>処理中…<span style="color:var(--muted)">（初回はモデルのダウンロードに数分かかります）</span>
    <div class="bar"><div id="pbar"></div></div>
    <div class="stage"><span id="pstage">待機中</span><span id="peta"></span></div>
    <pre class="log" id="log"></pre></div>`;
  const body = {
    url: document.getElementById('url').value,
    bpm: document.getElementById('bpm').value ? +document.getElementById('bpm').value : null,
    grid: +document.getElementById('grid').value,
    split: +document.getElementById('split').value,
    beat_offset: +document.getElementById('off').value,
    beats_per_bar: +document.getElementById('bpb').value,
    stem: [...document.querySelectorAll('input[name=stem]:checked')].map(x => x.value),
    legato: document.getElementById('legato').checked,
    chords: document.getElementById('chords').checked,
    force: document.getElementById('force').checked,
    max_span: +document.getElementById('span').value,
    refine: document.getElementById('refine').checked,
    triplets: document.getElementById('trip').value,
    fidelity: document.querySelector('input[name=fidelity]:checked').value,
  };
  const r = await fetch('/api/jobs', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const {id} = await r.json();
  const timer = setInterval(async () => {
    const j = await (await fetch('/api/jobs/' + id)).json();
    const log = document.getElementById('log'); if (log) { log.textContent = j.log.join('\n'); log.scrollTop = log.scrollHeight; }
    const bar = document.getElementById('pbar');
    if (bar) {
      bar.style.width = Math.round((j.progress || 0) * 100) + '%';
      document.getElementById('pstage').textContent = `${j.stage || ''}  ${Math.round((j.progress || 0) * 100)}%`;
      document.getElementById('peta').textContent = j.eta == null ? '' : j.eta < 5 ? 'まもなく完了' : `残り約 ${j.eta >= 90 ? Math.ceil(j.eta / 60) + ' 分' : Math.ceil(j.eta / 10) * 10 + ' 秒'}`;
    }
    if (j.status === 'done') { clearInterval(timer); go.disabled = false; showResult(j); }
    else if (j.status === 'error') {
      clearInterval(timer); go.disabled = false;
      out.innerHTML = `<div class="card err">エラー: ${j.error}<pre class="log">${j.log.join('\n')}</pre></div>`;
    }
  }, 1500);
};

async function loadPast() {
  try {
    const list = await (await fetch('/api/results')).json();
    const sel = document.getElementById('pastSel');
    for (const r of list) { const o = new Option(r.title, r.title); o.dataset.files = JSON.stringify(r.files); sel.add(o); }
    document.getElementById('past').style.display = list.length ? '' : 'none';
    sel.onchange = () => { const o = sel.selectedOptions[0]; if (o && o.dataset.files) showResult({ title: o.value, files: JSON.parse(o.dataset.files), log: [] }); };
  } catch (e) { /* server without results endpoint */ }
}
loadPast();

async function showResult(j) {
  const fl = j.files, stems = fl.stems;
  const stemKeys = Object.keys(stems);
  const stemBtns = stemKeys.map((k, i) => `<button data-stem="${k}" class="st${i === 0 ? ' on' : ''}">${stems[k].label}</button>`).join('');
  out.innerHTML = `<div class="card"><h2 style="margin:0 0 6px">${j.title}</h2>
    <div class="viewbar" style="margin-top:6px;flex-wrap:wrap">音源：${stemBtns}</div>
    <div class="viewbar" style="margin-top:6px">難易度：<span id="lvBtns"></span></div>
    <div class="links" id="links"></div>
    <div class="viewbar"><button id="vSheet" class="on">🎼 シートビュー</button><button id="vPiano">🎹 ピアノビュー</button></div>
    <div class="pages" id="pages"></div>
    <div id="pianoView"><canvas id="pianoCanvas"></canvas></div>
    <pre class="log">${j.log.join('\n')}</pre></div>`;
  const pages = document.getElementById('pages');
  let pianoMode = false, curStem = stems.other_bass ? 'other_bass' : stems.other ? 'other' : stemKeys[0], curLevel = null;  // practice default
  const vs = document.getElementById('vSheet'), vp = document.getElementById('vPiano');
  const setView = piano => {
    pianoMode = piano;
    vs.classList.toggle('on', !piano); vp.classList.toggle('on', piano);
    pages.style.display = piano ? 'none' : ''; document.getElementById('pianoView').style.display = piano ? 'block' : 'none';
    player.setPianoView(piano);
  };
  vs.onclick = () => setView(false); vp.onclick = () => setView(true);
  async function load(stemName, levelName) {
    const st = stems[stemName];
    if (!st.levels[levelName]) levelName = Object.keys(st.levels)[0];
    curStem = stemName; curLevel = levelName;
    const lv = st.levels[levelName];
    document.querySelectorAll('button.st').forEach(b => b.classList.toggle('on', b.dataset.stem === stemName));
    document.getElementById('lvBtns').innerHTML = Object.entries(st.levels).map(([k, v]) =>
      `<button data-level="${k}" class="lv${k === levelName ? ' on' : ''}">${v.label}</button>`).join('');
    document.querySelectorAll('button.lv').forEach(b => b.onclick = () => load(curStem, b.dataset.level));
    document.getElementById('links').innerHTML =
      `${lv.pdf ? `<a href="${lv.pdf}" download>⬇ PDF</a>` : ''}<a href="${st.midi}" download>⬇ MIDI</a><a href="${lv.musicxml}" download>⬇ MusicXML</a>`;
    pages.innerHTML = '';
    for (const s of lv.svgs) {                       // inline SVG so notes can be highlighted
      const div = document.createElement('div'); div.className = 'page';
      div.innerHTML = await (await fetch(s)).text();
      pages.appendChild(div);
    }
    const pb = await (await fetch(lv.playback)).json();
    player.load(pb, { audio_original: fl.audio_original, audio_stem: st.audio, stem_label: st.label, level: levelName }, /*keepPosition*/ true);
    if (pianoMode) player.setPianoView(true);
  }
  document.querySelectorAll('button.st').forEach(b => b.onclick = () => load(b.dataset.stem, curLevel));
  await load(curStem, 'original');
}

// ---------------------------------------------------------------- piano view (keyboard + falling notes)
const pianoView = (() => {
  const LO = 21, HI = 108, LOOKAHEAD = 4;        // seconds of notes shown above the keyboard
  const isBlack = p => [1, 3, 6, 8, 10].includes(p % 12);

      const n = notes[i]; if (n.length < 8 || !n[7] || n[0] > t) continue;
      const h = n[6]; if (st[h][n[7]]) continue;

  const hands = { rh: null, lh: null };
  const SKIN = '#f8dcc8', SKIN_DARK = '#ecc1a6', SKIN_LINE = 'rgba(176,120,96,0.55)', NAIL = '#fbe3e6';
  function lerp(a, b, k) { return a + (b - a) * k; }
  // Natural finger spacing (in white-key widths) and relative reach (2-3-4 are longer than 1 and 5).
  const SPACING = { 1: 1.5, 2: 1.0, 3: 1.0, 4: 1.0 };   // gap between finger f and f+1 when relaxed

        if (hands[h]) drawHand(hands[h], dir, kb, kb + HB, h);   // keep the hand as it is, do not recompute
        continue;
      }
      // 1) fixed points: fingers that are pressing now (or were within the last 0.4 s) stay on their keys
      const fixed = {};
      for (const f of knownF) if (known[f].pressed || known[f].age < 0.4) fixed[f] = keyCenter(known[f].pitch);

      const x = {};

    mode.dataset.original = files.audio_original || ''; mode.dataset.stem = files.audio_stem || '';
    if (prevMode && [...mode.options].some(o => o.value === prevMode)) mode.value = prevMode;
    else mode.value = 'synth';   // practice default: the transcription itself
    setupAudio(); applyTimeline();
    el.style.display = 'block';
    seek.value = duration ? Math.round(Math.min(pos, duration) / duration * 1000) : 0;
    timeEl.textContent = `${fmt(Math.min(pos, duration))} / ${fmt(duration)}`;
    pianoView.reset();
    bindMeasureClicks(); clickState = 0; paintLoop();
  }
  function setPianoView(on) { pianoOn = on; if (on) { pianoView.reset(); pianoView.draw(pb, current(), activeLoop()); } }
  function setupAudio() {
    const src = mode.value === 'original' ? mode.dataset.original : mode.value === 'stem' ? mode.dataset.stem : null;
    if (audio) { audio.pause(); audio = null; }
    if (src) { audio = new Audio(src); audio.preload = 'auto'; audio.playbackRate = rate(); audio.onended = () => stop(true); }
  }
  // Built-in fallback instrument (no samples needed): two oscillators with a piano-like decay.
  function simplePiano(ctx, dest) {
    const voices = new Set();
    return {
      play(midi, when, o) {
        const f = 440 * Math.pow(2, (midi - 69) / 12), g = ctx.createGain(), dur = o.duration || 1, vol = (o.gain || 0.5) * 0.35;
        const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
        o1.type = 'triangle'; o1.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2; 
        const g2 = ctx.createGain(); g2.gain.value = 0.25; o2.connect(g2); g2.connect(g); o1.connect(g); g.connect(dest);
        g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + 0.008);
        g.gain.setTargetAtTime(vol * 0.35, when + 0.02, 0.35);                       // decay
        g.gain.setTargetAtTime(0, when + dur, 0.08);                                  // release
        o1.start(when); o2.start(when); o1.stop(when + dur + 0.6); o2.stop(when + dur + 0.6);
        const v = { stop: () => { try { g.gain.cancelScheduledValues(ctx.currentTime); g.gain.setTargetAtTime(0, ctx.currentTime, 0.03); o1.stop(ctx.currentTime + 0.2); o2.stop(ctx.currentTime + 0.2); } catch (e) {} voices.delete(v); } };
        voices.add(v); o1.onended = () => voices.delete(v);
        return v;
      },
      stop() { for (const v of [...voices]) v.stop(); },
    };
  }
  let synthLoading = false;
  async function ensureSynth() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') await ac.resume();
    if (!piano) {
      status.textContent = 'ピアノ音源を読み込み中…';
      // MusyngKite grand piano, shaped to match Klangio's synth: its samples decay faster (C4: -20 dB at ~0.7 s
      // vs ~2 s) with similar brightness, so a decay/sustain envelope brings the two close.
      // Room: the soundfont is bone-dry, the separated accompaniment is not. Synthetic IR (decaying noise)
      // through a convolver, mixed in parallel with the dry signal; amount from the 残響 slider.
      // bus -> compressor -> master (auto-levelled to the original recording's RMS) -> out (+ reverb send)
      const bus = ac.createGain();
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
      master = ac.createGain(); master.gain.value = 2.5;
      bus.connect(comp); comp.connect(master); master.connect(ac.destination);
      analyser = ac.createAnalyser(); analyser.fftSize = 2048; master.connect(analyser);
      const conv = ac.createConvolver(); conv.buffer = makeIR(ac, 1.8, 2.5); wet = ac.createGain();
      master.connect(conv); conv.connect(wet); wet.connect(ac.destination); setReverb();
      try {
        if (typeof Soundfont === 'undefined') throw new Error('soundfont-player が読み込めません');
        piano = await Promise.race([
          Soundfont.instrument(ac, 'acoustic_grand_piano', { soundfont: 'MusyngKite', gain: 1.4, destination: bus, release: 0.35 }),
          new Promise((_, rej) => setTimeout(() => rej(new Error('タイムアウト')), 20000)),
        ]);
        status.textContent = '';
      } catch (err) {
        piano = simplePiano(ac, bus);   // keep practising even without the sampled piano
        status.textContent = 'ピアノ音源を取得できないため簡易音源で再生します（' + (err && err.message || err) + '）';
      }
    }
  }
  function makeIR(ctx, seconds, decay) {
    const len = Math.floor(ctx.sampleRate * seconds), buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return buf;
  }
  function setReverb() { if (wet) wet.gain.value = 0.6 * (+revEl.value / 100); }
  revEl.oninput = setReverb;
  function current() {
    if (!playing) return +seek.value / 1000 * duration;
    if (isSynth() && loopSched >= 0) {
      const el = ac.currentTime - loopCtxBase;
      return loopS + (el - Math.floor(el / loopIterLen) * loopIterLen) * rate();
    }
    return isSynth() ? synthStartT + (ac.currentTime - synthStartCtx) * rate() : audio.currentTime;
  }
  async function play() {
    if (!pb || synthLoading) return;
    let t0 = +seek.value / 1000 * duration;
    if (loopOn.checked) { const [a, b] = loopRange(); if (t0 < barTime(a) || t0 >= barTime(b + 1) - 0.02) { t0 = barTime(a); seek.value = Math.round(t0 / duration * 1000); } }
    if (isSynth()) {
      synthLoading = true; pp.textContent = '…';
      try { await ensureSynth(); } catch (err) { status.textContent = '音声を初期化できません: ' + (err && err.message || err); synthLoading = false; pp.textContent = '▶'; return; }
      synthLoading = false;
      if (!isSynth()) return;   // mode changed while loading
      synthStartT = t0; synthStartCtx = ac.currentTime;
      const r = rate(), lp = activeLoop();
      if (lp) {
        loopS = lp.start; loopE = lp.end; loopIterLen = (loopE - loopS) / r;
        loopCtxBase = ac.currentTime - (t0 - loopS) / r;
        scheduleIteration(0, t0); scheduleIteration(1);
        playing = true; pp.textContent = '⏸'; tick();
        return;
      }
      // Written notes are on a grid with hard cut-offs; a little human timing jitter, a touch of overlap
      // (like a light pedal) and velocity variation keep it from sounding like a sequencer (see scheduleAhead).
      synthNotes = [...pb.notes].sort((a, b) => a[0] - b[0]);
      let lo = 0, hi = synthNotes.length;
      while (lo < hi) { const m = (lo + hi) >> 1; if (synthNotes[m][0] < t0) lo = m + 1; else hi = m; }
      synthIdx = lo;
      for (let i = Math.max(0, lo - 60); i < lo; i++) {          // notes already sounding at t0
        const [s, e, p, v] = synthNotes[i];
        if (e > t0 + 0.05) piano.play(p, ac.currentTime, synthNoteOpts(s, e, v, r, t0));
      }
      playing = true; pp.textContent = '⏸';
      scheduleAhead();
      tick();
      return;
    } else {
      if (!audio) setupAudio();
      audio.currentTime = t0; audio.playbackRate = rate();
      try { await audio.play(); } catch (err) { status.textContent = '音声を再生できません: ' + err.message; return; }
    }
    playing = true; pp.textContent = '⏸'; tick();
  }
  function stop(ended) {
    loopSched = -1;
    if (piano) piano.stop();
    if (audio) audio.pause();
    playing = false; pp.textContent = '▶'; cancelAnimationFrame(raf);
    if (ended) { seek.value = 0; highlight(-1); }
  }
  function highlight(idx) {
    if (idx === lastIdx) return;
    for (const id of lit) document.getElementById(id)?.classList.remove('playing');
    lit.clear();
    if (idx >= 0) {
      // notes still sounding at idx: turn on everything on'ed up to idx that hasn't been off'ed
      const on = new Set();
      for (let i = Math.max(0, idx - 40); i <= idx; i++) { pb.timemap[i].on.forEach(x => on.add(x)); pb.timemap[i].off.forEach(x => on.delete(x)); }
      let first = null;
      for (const id of on) { const g = document.getElementById(id); if (g) { g.classList.add('playing'); lit.add(id); first ??= g; } }
      if (first) { const r = first.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 140) first.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    }
    lastIdx = idx;
  }
  function tick() {
    let t = current();
    const lp = activeLoop();
    if (lp) {
      if (isSynth()) {
        if (loopSched < 0) { seekTo(lp.start); return; }        // loop switched on mid-play: restart in loop mode
        const k = Math.floor((ac.currentTime - loopCtxBase) / loopIterLen);
        if (k + 1 > loopSched) scheduleIteration(k + 1);
      } else if (audio) {
        if (t >= lp.end - 0.02 || t < lp.start - 2) {           // wrap: jump the position, volume already faded
          audio.currentTime = lp.start; t = lp.start;
        }
        const toEnd = lp.end - t, fromStart = t - lp.start;
        audio.volume = Math.max(0.1, Math.min(1, toEnd / FADE, fromStart / FADE + 0.1));
      }
    } else if (audio && audio.volume !== 1) audio.volume = 1;
    if (t >= duration) { stop(true); return; }
    seek.value = Math.round(t / duration * 1000); timeEl.textContent = `${fmt(t)} / ${fmt(duration)}`;
    let lo = 0, hi = pb.timemap.length - 1, idx = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (pb.timemap[m].t <= t) { idx = m; lo = m + 1; } else hi = m - 1; }
    highlight(idx);
    if (isSynth() && !lp) scheduleAhead();
    if (pianoOn) pianoView.draw(pb, t, lp);
    raf = requestAnimationFrame(tick);
  }
  pp.onclick = () => playing ? stop() : play();
  seek.oninput = () => { const was = playing; if (was) stop(); timeEl.textContent = `${fmt(+seek.value/1000*duration)} / ${fmt(duration)}`; if (pianoOn) pianoView.draw(pb, current(), activeLoop()); if (was) play(); };
  mode.onchange = () => { const was = playing; stop(); setupAudio(); applyTimeline(); lastIdx = -1; if (was) play(); };
  srcSel.onchange = tempoSel.onchange = () => { const was = playing; stop(); applyTimeline(); lastIdx = -1; if (pianoOn) pianoView.draw(pb, current(), activeLoop()); if (was) play(); };
  rateEl.onchange = () => { const was = playing; if (was) stop(); if (audio) audio.playbackRate = rate(); if (was) play(); };
  document.addEventListener('keydown', e => { if (e.code === 'Space' && pb && e.target.tagName !== 'INPUT') { e.preventDefault(); pp.onclick(); } });
  return { load, stop, setPianoView, debug: () => ({ masterGain: master ? master.gain.value : null, target: src && src.loudness_db, acState: ac ? ac.state : null, piano: !!piano, playing, notes: pb ? pb.notes.length : 0, loopSched, rms: (() => { if (!analyser) return null; const b = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(b); let s = 0; for (const v of b) s += v * v; return Math.sqrt(s / b.length); })() }) };
})();
</script>
